
---
- name: Configure all servers
  hosts: all
  become: true

  tasks:
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - git
          - curl
          - ufw
          - fail2ban
          - ca-certificates
          - gnupg
          - python3-pymongo
        state: present

- name: Configure MongoDB database
  hosts: db
  become: true

  tasks:
    - name: Download MongoDB signing key
      ansible.builtin.get_url:
        url: https://www.mongodb.org/static/pgp/server-8.0.asc
        dest: /tmp/mongodb-server-8.0.asc
        mode: "0644"

    - name: Convert MongoDB signing key
      ansible.builtin.command:
        cmd: >
          gpg --dearmor
          --output /usr/share/keyrings/mongodb-server-8.0.gpg
          /tmp/mongodb-server-8.0.asc
        creates: /usr/share/keyrings/mongodb-server-8.0.gpg


    - name: Add MongoDB repository
      ansible.builtin.deb822_repository:
        name: mongodb-org-8.0
        types:
          - deb
        uris:
          - https://repo.mongodb.org/apt/ubuntu
        suites:
          - noble/mongodb-org/8.0
        components:
          - multiverse
        architectures:
          - amd64
        signed_by: /usr/share/keyrings/mongodb-server-8.0.gpg
        state: present
        enabled: true

    - name: Update apt cache after adding MongoDB repository
      ansible.builtin.apt:
        update_cache: true


    - name: Install MongoDB
      ansible.builtin.apt:
        name: mongodb-org
        state: present

    - name: Start and enable MongoDB
      ansible.builtin.systemd:
        name: mongod
        state: started
        enabled: true

- name: Deploy TravelMemory application
  hosts: web
  become: true

  tasks:
    - name: Show application deployment phase
      ansible.builtin.debug:
        msg: "Next phase - Node.js, Express, React and Nginx"
